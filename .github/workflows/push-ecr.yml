# .github/workflows/push-ecr.yml
name: Build and Push Docker Image to ECR

on:
  push:
    branches:
      - staging
      - production

env:
  AWS_REGION: ap-southeast-1 # <--- 替換為你的 AWS 區域

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # needed for OIDC
      contents: read # needed for checkout
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 使用 OpenID Connect (OIDC) 自動獲取臨時憑證
          # 這比使用硬編碼的 AWS Access Key/Secret Key 更安全且推薦
          role-to-assume: arn:aws:iam::765774143395:role/github-action # <--- 替換為你在 AWS IAM 建立的 OIDC 角色 ARN
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine ECR Repository and Image Tag
        id: determine_repo_tag
        run: |
          # 判斷是哪個分支觸發的
          # 對於 push 事件，github.ref_name 就是分支名 (staging 或 production)
          BRANCH_NAME=""
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BRANCH_NAME="${{ github.ref_name }}"
          else
            echo "Unsupported event type or action for ECR push. Exiting."
            exit 1
          fi

          ECR_REPOSITORY="healthy-api-${BRANCH_NAME}"
          # 使用分支名和 commit SHA 作為 Image Tag，確保唯一性
          IMAGE_TAG="${BRANCH_NAME}-${{ github.sha }}" 

          echo "Detected Branch: $BRANCH_NAME"
          echo "ECR Repository: $ECR_REPOSITORY"
          echo "Image Tag: $IMAGE_TAG"
          echo "ECR_REPOSITORY=$ECR_REPOSITORY" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build, tag, and push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.determine_repo_tag.outputs.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ steps.determine_repo_tag.outputs.IMAGE_TAG }}
        run: |
          echo "Building image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG . # 假設 Dockerfile 位於 app/ 目錄
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
